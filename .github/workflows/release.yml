name: Build Android APK
on:
  push:
    branches: [work, main]
    tags: ['v*']
  pull_request:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Install Android Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: visual-watch-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: app/build/outputs/apk/debug/app-debug.apk, generate_release_notes: true }
